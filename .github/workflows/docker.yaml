name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]


env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:

  build:
    name: Pull
    runs-on: ubuntu-latest
    steps:
    - name: Before freeing up disk space
      run: |
        echo "Before freeing up disk space"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    # 增加可用磁盘空间
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:

        root-reserve-mb: 10240  # 2026-09-04：2048 时 runner 在 Install trivy 一步报 "No space left on device"；6144 时根盘仍 100%（trivy 扫描要在临时目录落镜像 tar）
        swap-size-mb: 128
        remove-dotnet: 'true'
        remove-haskell: 'true'
        # 如果空间还是不够用，可以把以下开启，清理出更多空间
        # remove-android: 'true'
        # remove-codeql: 'true'
        build-mount-path: '/var/lib/docker/'

    - name: Restart docker
      run: sudo service docker restart

    - name: Free up disk space complete
      run: |
        echo "Free up disk space complete"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Docker Setup Buildx
      uses: docker/setup-buildx-action@v3

    # 漏洞扫描：每个镜像 pull 后跑 trivy（HIGH/CRITICAL），报告进 Step Summary 并作为产物上传；不阻断推送（结果由使用方在台账里逐 CVE 处置）
    - name: Install trivy
      run: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
        trivy --version
        mkdir -p trivy-reports
        # 漏洞库缓存放到扩容后的大盘（/var/lib/docker 由 maximize-build-space 挂载），别占根盘
        sudo mkdir -p /var/lib/docker/trivy-cache && sudo chown "$(id -u):$(id -g)" /var/lib/docker/trivy-cache
        echo "TRIVY_CACHE_DIR=/var/lib/docker/trivy-cache" >> "$GITHUB_ENV"
        # trivy 扫 docker 守护进程里的镜像时会把镜像 tar 落到 TMPDIR（默认 /tmp 在根盘）——也放大盘
        sudo mkdir -p /var/lib/docker/trivy-tmp && sudo chown "$(id -u):$(id -g)" /var/lib/docker/trivy-tmp
        echo "TMPDIR=/var/lib/docker/trivy-tmp" >> "$GITHUB_ENV"
        df -hT / /var/lib/docker

    - name: Build and push image Aliyun
      run: |
        docker login -u $ALIYUN_REGISTRY_USER -p $ALIYUN_REGISTRY_PASSWORD $ALIYUN_REGISTRY
        # 数据预处理,判断镜像是否重名
        declare -A duplicate_images
        declare -A temp_map
        while IFS= read -r line || [ -n "$line" ]; do
            # 忽略空行与注释
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
                continue
            fi
            
            # 获取镜像的完整名称，例如kasmweb/nginx:1.25.3（命名空间/镜像名:版本号）
            image=$(echo "$line" | awk '{print $NF}')
            # 将@sha256:等字符删除
            image="${image%%@*}"
            echo "image $image"
            # 获取镜像名:版本号  例如nginx:1.25.3
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            echo "image_name_tag $image_name_tag"
            # 获取命名空间 例如kasmweb,  这里有种特殊情况 docker.io/nginx，把docker.io当成命名空间，也OK
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            echo "name_space: $name_space"
            # 这里不要是空值影响判断
            name_space="${name_space}_"
            # 获取镜像名例如nginx
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
            echo "image_name: $image_name"
            
            # 如果镜像存在于数组中，则添加temp_map
            if [[ -n "${temp_map[$image_name]}" ]]; then
                 # 如果temp_map已经存在镜像名，判断是不是同一命名空间
                 if [[ "${temp_map[$image_name]}" != $name_space  ]]; then
                    echo "duplicate image name: $image_name"
                    duplicate_images[$image_name]="true"
                 fi
            else
                # 存镜像的命名空间
                temp_map[$image_name]=$name_space
            fi       
        done < images.txt
        
        
        while IFS= read -r line || [ -n "$line" ]; do
            # 忽略空行与注释
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
                continue
            fi
        
            echo "docker pull $line"
            docker pull $line
            # ---- trivy 漏扫（不影响后续 tag/push）----
            scan_image=$(echo "$line" | awk '{print $NF}')
            report_name=$(echo "$scan_image" | tr '/:@' '___')
            # 失败时把 trivy 自己的报错留进 .err（否则只看到"trivy failed"什么都查不了）
            # 用 root 跑：/var/lib/docker 本身是 root:root 0710，runner 用户进不去它下面的目录（第三次失败：mkdir …/trivy-tmp/…: permission denied）
            TRIVY="sudo -E env PATH=$PATH TRIVY_CACHE_DIR=$TRIVY_CACHE_DIR TMPDIR=$TMPDIR trivy"
            if ! $TRIVY image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 --format table --output "trivy-reports/${report_name}.txt" "$scan_image" 2> "trivy-reports/${report_name}.err"; then
              echo "trivy failed for $scan_image (see ${report_name}.err)" > "trivy-reports/${report_name}.txt"; tail -20 "trivy-reports/${report_name}.err"
            fi
            $TRIVY image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 --format json --output "trivy-reports/${report_name}.json" "$scan_image" 2>>"trivy-reports/${report_name}.err" || true
            sudo chown -R "$(id -u):$(id -g)" trivy-reports
            df -h / /var/lib/docker | tail -2
            {
              echo "## trivy: $scan_image (HIGH/CRITICAL, fixed-only)"
              echo '```'
              head -80 "trivy-reports/${report_name}.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            platform=$(echo "$line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')
            echo "platform is $platform"
            # 如果存在架构信息 将架构信息拼到镜像名称前面
            if [ -z "$platform" ]; then
                platform_prefix=""
            else
                platform_prefix="${platform//\//_}_"
            fi
            echo "platform_prefix is $platform_prefix"
            # 获取镜像的完整名称，例如kasmweb/nginx:1.25.3（命名空间/镜像名:版本号）
            image=$(echo "$line" | awk '{print $NF}')

            # 获取 镜像名:版本号  例如nginx:1.25.3
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            # 获取命名空间 例如kasmweb  这里有种特殊情况 docker.io/nginx，把docker.io当成命名空间，也OK
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            # 获取镜像名例  例如nginx
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
        
            name_space_prefix=""
            # 如果镜像名重名
            if [[ -n "${duplicate_images[$image_name]}" ]]; then
               #如果命名空间非空，将命名空间加到前缀
               if [[ -n "${name_space}" ]]; then
                  name_space_prefix="${name_space}_"
               fi
            fi
            
            # 将@sha256:等字符删除
            image_name_tag="${image_name_tag%%@*}"
            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name_tag"
            echo "docker tag $image $new_image"
            docker tag $image $new_image
            echo "docker push $new_image"
            docker push $new_image
            echo "开始清理磁盘空间"
            echo "=============================================================================="
            df -hT
            echo "=============================================================================="
            docker rmi $image
            docker rmi $new_image
            echo "磁盘空间清理完毕"
            echo "=============================================================================="
            df -hT
            echo "=============================================================================="     
            
        done < images.txt

    - name: Upload trivy reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: trivy-reports
        path: trivy-reports/
        if-no-files-found: warn
        retention-days: 30
